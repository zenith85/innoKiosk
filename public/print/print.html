<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Print</title>
  <link rel="stylesheet" href="/print/print.css?v=17" />
</head>
<body>

<div class="receipt">

  <!-- ROW 1: Text 1 -->
  <section class="row row-text1">
    <p id="text1">국내 다양한 서점사업 이용이 가능한 이노스페이스원 이북리더기!</p>
  </section>

  <!-- ROW 2: Device image + Book cover image -->
  <section class="row row-images">
    <div class="img-box">
      <img id="device-img" src="" alt="device" />
    </div>
    <div class="img-box">
      <img id="book-img" src="" alt="book" />
    </div>
  </section>

  <!-- ROW 3: Text 2 -->
  <section class="row row-text2">
    <p id="text2-device"></p>
    <p id="text2-book"></p>
  </section>

  <!-- ROW 4: QR code + Text 3 -->
  <section class="row row-qr">
    <img src="" class="qr-img" style="display:none" />
    <p id="text3">공식 홈페이지에서 다양한 혜택받기</p>
  </section>

  <!-- ROW 5: STAMP! -->
  <section class="row row-stamp">
    <p class="stamp-word">STAMP!</p>
  </section>

  <!-- ROW 6: 3 stamp circles -->
  <section class="row row-circles">
    <div class="circle-wrap">
      <img src="/img/print/stamp.png" class="stamp-overlay" />
      <div class="circle"></div>
    </div>
    <div class="circle"></div>
    <div class="circle"></div>
  </section>

  <!-- ROW 7: Logo -->
  <section class="row row-logo">
    <img src="/img/print/logo.png" class="logo" />
  </section>

</div>

<script>
  const params     = new URLSearchParams(window.location.search);
  const deviceCode = params.get("device") || "";
  const bookCode   = params.get("book")   || "";
  const lang       = params.get("lang")   || "ko";

  function getText(val) {
    if (!val) return '';
    if (typeof val === 'object') return val[lang] || val.ko || val.en || '';
    return val;
  }

  function nl2br(str) {
    return str.split('\\n').join('\n').split('\n').join('<br>');
  }

  const deviceImg = document.getElementById("device-img");
  const bookImg   = document.getElementById("book-img");

  fetch("/data/mapping.json")
    .then(r => r.json())
    .then(mapping => {
      const device = (mapping.device || {})[deviceCode] || {};
      const book   = (mapping.book   || {})[bookCode]   || {};

      const deviceTitle     = getText(device.title);
      const bookTitle       = getText(book.title);
      const bookDescription = getText(book.description);

      if (bookDescription) {
        document.getElementById("text1").innerHTML = nl2br(bookDescription);
      }
      const bookCatchphrase = getText(book.catchphrase);

      const deviceLine = deviceTitle + (bookCatchphrase ? ' ' + bookCatchphrase : '');
      if (deviceLine) document.getElementById("text2-device").innerHTML = nl2br(deviceLine);
      if (bookTitle)  document.getElementById("text2-book").textContent = bookTitle;

      const qrImg = document.querySelector(".qr-img");

      let loaded = 0;
      const total = (device.image ? 1 : 0) + (book.image ? 1 : 0) + (device.qr ? 1 : 0) || 1;

      const doprint = () => {
        loaded++;
        if (loaded >= total) {
          window.print();
          window.onafterprint = () => { window.location.href = "/"; };
          setTimeout(() => { window.location.href = "/"; }, 3000);
        }
      };

      if (device.image) {
        deviceImg.onload  = doprint;
        deviceImg.onerror = doprint;
        deviceImg.src     = device.image;
      } else {
        deviceImg.style.display = "none";
      }

      if (book.image) {
        bookImg.onload  = doprint;
        bookImg.onerror = doprint;
        bookImg.src     = book.image;
      } else {
        bookImg.style.display = "none";
      }

      if (device.qr) {
        qrImg.style.display = "block";
        qrImg.onload  = doprint;
        qrImg.onerror = doprint;
        qrImg.src     = device.qr;
      } else {
        qrImg.style.display = "none";
        if (!device.image && !book.image) doprint();
      }
    });
</script>

</body>
</html>

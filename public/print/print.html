<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Print</title>
  <link rel="stylesheet" href="/print/print.css" />
</head>
<body>

<div class="receipt">

  <!-- ELEMENT 1: HEADER -->
  <section class="header">
    <p class="subtitle">국내 다양한 서점사업 이용이 가능한</p>
    <h1 class="title">이노스페이스원<br/>이북리더기!</h1>
  </section>

  <!-- ELEMENT 2: DEVICE (ONE ONLY) -->
  <section class="device">
    <img id="device-img" src="/img/print/luna.png" alt="device" />
    <p id="device-name" class="device-name">LUNA</p>
    <p id="device-desc" class="device-desc">
      화이트 감성이 더해진<br/>6인치 루나
    </p>
  </section>

  <!-- ELEMENT 3: FOOTER -->
  <section class="footer">
    <img src="/img/print/logo.png" class="logo" />
    <div class="qr">
      <img src="/img/print/qr.png" />
      <p>공식 홈페이지<br/>다양한 혜택받기</p>
    </div>
  </section>

</div>

<script>
  /* ================= DEVICE DESCRIPTIONS ================= */

  const DEVICE_DESC = {
    luna2:  "화이트 감성이 더해진<br/>6인치 루나2",
    lunax2: "강력한 성능의<br/>6인치 루나 X2",
    jigu:   "선명한 화면의<br/>7인치 지구",
    comet:  "가볍고 빠른<br/>6인치 코멧",
    marsa:  "몰입형 대화면<br/>10인치 마스 A"
  };

  /* ================= TYPE → DEVICE ================= */

  const params = new URLSearchParams(window.location.search);
  const type = params.get("type") || "";

  const deviceImg = document.getElementById("device-img");

  fetch("/data/mapping.json")
    .then(r => r.json())
    .then(mapping => {
      const result = mapping[type];
      if (!result) return;

      document.getElementById("device-name").innerHTML = result.title;
      document.getElementById("device-desc").innerHTML = DEVICE_DESC[result.device] || result.title;

      /* ================= PRINT & RESTART ================= */

      deviceImg.onload = () => {
        window.print();
        window.onafterprint = () => { window.location.href = "/"; };
        setTimeout(() => { window.location.href = "/"; }, 3000);
      };
      deviceImg.src = result.deviceImage;
    });
</script>

</body>
</html>
